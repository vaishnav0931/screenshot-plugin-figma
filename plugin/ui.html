<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Site screenshots</title>
  <style>
    :root {
      --paper: #eef1f5;
      --surface: #ffffff;
      --sunken: #f6f8fa;
      --line: #d6dce5;
      --line-strong: #b7c0cd;
      --ink: #161e29;
      --ink-2: #4a5666;
      --ink-3: #78859a;
      --signal: #2a3fdc;
      --signal-ink: #1f30b8;
      --signal-wash: #e6e9fc;
      --ok: #0c7a5c;
      --ok-wash: #dcf3ea;
      --warn: #8f5200;
      --warn-wash: #fbebd0;
      --err: #b3261e;
      --err-wash: #fbe3e1;
      --r-1: 4px;
      --r-2: 8px;
      --font: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      --mono: ui-monospace, "Cascadia Mono", Consolas, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      background: var(--paper);
      color: var(--ink);
      font-size: 12.5px;
      line-height: 1.45;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    button { font-family: inherit; color: inherit; }
    .hidden { display: none !important; }

    :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

    /* Header */
    .header {
      padding: 14px 16px 0;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    .header-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 15px;
      font-weight: 650;
      letter-spacing: -0.015em;
    }

    .brand-subtitle {
      font-size: 12px;
      color: var(--ink-2);
      margin-top: 1px;
    }

    .stepper { display: flex; gap: 18px; }

    .step-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 0 9px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--ink-3);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      cursor: pointer;
    }

    .step-tab:hover { color: var(--ink); }
    .step-tab.active { color: var(--ink); border-bottom-color: var(--signal); font-weight: 600; }

    .step-num {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-3);
    }
    .step-tab.active .step-num { color: var(--signal); }

    /* Layout */
    .main-view {
      flex: 1;
      overflow-y: auto;
      padding: 14px 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-2);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .card-title { font-size: 13px; font-weight: 650; letter-spacing: -0.005em; }

    .badge {
      font-family: var(--mono);
      font-size: 11.5px;
      padding: 1px 8px;
      border-radius: 999px;
      background: var(--sunken);
      border: 1px solid var(--line);
      color: var(--ink-2);
    }
    .badge.ready-ten { background: var(--ok-wash); border-color: transparent; color: var(--ok); }
    .badge.warn { background: var(--warn-wash); border-color: transparent; color: var(--warn); }

    /* Buttons */
    .toolbar { display: flex; flex-wrap: wrap; gap: 6px; }

    .btn-chip {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-1);
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }
    .btn-chip:hover { background: var(--sunken); border-color: var(--ink-3); }
    .btn-chip.active-toggle { background: var(--signal-wash); border-color: var(--signal); color: var(--signal-ink); }

    .btn-primary {
      flex: 1;
      background: var(--ink);
      color: #fff;
      border: none;
      border-radius: var(--r-2);
      padding: 11px 16px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover:not(:disabled) { background: var(--signal); }
    .btn-primary:disabled { background: var(--line-strong); color: #fff; cursor: not-allowed; }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-2);
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 500;
      cursor: pointer;
    }
    .btn-secondary:hover { background: var(--sunken); }

    .btn-danger {
      background: var(--err-wash);
      color: var(--err);
      border: 1px solid transparent;
      border-radius: var(--r-2);
      padding: 10px 14px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* URL input */
    textarea.url-input {
      width: 100%;
      min-height: 140px;
      max-height: 260px;
      resize: vertical;
      background: var(--sunken);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--r-1);
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.6;
      outline: none;
      user-select: text;
    }
    textarea.url-input:focus { border-color: var(--signal); background: var(--surface); }
    textarea.url-input::placeholder { color: var(--ink-3); }

    .helper-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 12px;
      color: var(--ink-2);
    }

    /* Parsed list */
    .parsed-list {
      max-height: 140px;
      overflow-y: auto;
      border: 1px solid var(--line);
      border-radius: var(--r-1);
      background: var(--sunken);
    }

    .parsed-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 8px;
      font-size: 12px;
      border-bottom: 1px solid var(--line);
    }
    .parsed-item:last-child { border-bottom: none; }

    .parsed-item-left { display: flex; align-items: center; gap: 8px; min-width: 0; flex: 1; }

    .parsed-index {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-3);
      flex-shrink: 0;
    }

    .parsed-favicon { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }

    .parsed-url {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-family: var(--mono);
      font-size: 11.5px;
    }

    .btn-remove-url {
      background: none;
      border: none;
      color: var(--ink-3);
      cursor: pointer;
      padding: 2px 6px;
      border-radius: var(--r-1);
      font-size: 12px;
    }
    .btn-remove-url:hover { color: var(--err); background: var(--err-wash); }

    /* Settings */
    .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 12px; color: var(--ink-2); font-weight: 500; }

    select, input[type="number"], input[type="text"] {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid var(--line-strong);
      border-radius: var(--r-1);
      padding: 6px 8px;
      font-family: inherit;
      font-size: 12.5px;
    }
    select:focus, input:focus { border-color: var(--signal); }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border: 1px solid var(--line);
      border-radius: var(--r-1);
      background: var(--sunken);
      cursor: pointer;
    }
    .toggle-row.highlight-whole-screen { border-color: var(--signal); background: var(--signal-wash); }

    .toggle-label { display: flex; flex-direction: column; }
    .toggle-label span { font-size: 12.5px; font-weight: 600; }
    .toggle-label small { font-size: 11.5px; color: var(--ink-2); }

    .toggle-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 30px;
      height: 18px;
      border-radius: 999px;
      background: var(--line-strong);
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.12s;
    }
    .toggle-row input[type="checkbox"]::after {
      content: "";
      position: absolute;
      top: 2px; left: 2px;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.12s;
    }
    .toggle-row input[type="checkbox"]:checked { background: var(--signal); }
    .toggle-row input[type="checkbox"]:checked::after { transform: translateX(12px); }

    input[type="checkbox"] { accent-color: var(--signal); cursor: pointer; }

    /* Footer */
    .footer {
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    /* Progress */
    .progress-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-2);
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .progress-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .progress-stats { font-size: 13px; font-weight: 650; }
    .progress-sub { font-size: 12px; color: var(--ink-2); margin-top: 1px; }

    .progress-bar-track { width: 100%; height: 4px; background: var(--line); border-radius: 999px; overflow: hidden; }
    .progress-bar-fill { height: 100%; width: 0%; background: var(--signal); transition: width 0.25s ease; }

    /* Capture cards: each one reads as the browser frame that lands in Figma */
    .capture-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }

    .capture-item {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .capture-item.status-capturing { border-color: var(--signal); }
    .capture-item.status-error { border-color: var(--err); }

    .capture-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 7px 10px 7px 56px;
      background: var(--sunken);
      border-bottom: 1px solid var(--line);
      position: relative;
    }
    .capture-top-row::before {
      content: "";
      position: absolute;
      left: 10px; top: 50%;
      width: 8px; height: 8px;
      margin-top: -4px;
      border-radius: 50%;
      background: #ff5f57;
      box-shadow: 14px 0 0 #febc2e, 28px 0 0 #28c840;
    }

    .capture-title-row { display: flex; align-items: center; gap: 6px; min-width: 0; }

    .capture-host {
      font-weight: 600;
      font-size: 12.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thumb-box {
      width: 100%;
      height: 170px;
      background: var(--sunken);
      overflow-y: auto;
      overflow-x: hidden;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      font-size: 12px;
      color: var(--ink-3);
      cursor: pointer;
    }
    .thumb-box img { width: 100%; height: auto; display: block; }
    .thumb-placeholder { height: 100%; width: 100%; display: flex; align-items: center; justify-content: center; }

    .capture-info { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px 0; }
    .capture-url {
      font-family: var(--mono);
      font-size: 11px;
      color: var(--ink-2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .capture-meta { font-size: 11.5px; color: var(--ink-3); }

    .capture-actions { display: flex; justify-content: flex-end; gap: 6px; padding: 8px 10px 10px; }

    .status-pill {
      padding: 1px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      flex-shrink: 0;
    }
    .status-pill.queued { background: var(--line); color: var(--ink-2); }
    .status-pill.capturing { background: var(--signal-wash); color: var(--signal-ink); }
    .status-pill.done { background: var(--ok-wash); color: var(--ok); }
    .status-pill.error { background: var(--err-wash); color: var(--err); }

    /* Preview modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(22, 30, 41, 0.82);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 10px;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-radius: var(--r-1);
      padding: 8px 12px;
    }
    .modal-body {
      flex: 1;
      overflow-y: auto;
      background: var(--surface);
      border-radius: var(--r-1);
      padding: 10px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .modal-body img { max-width: 100%; height: auto; display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 10px; height: 10px;
      border: 2px solid var(--signal-wash);
      border-top-color: var(--signal);
      border-radius: 50%;
      animation: spin 0.75s linear infinite;
      display: inline-block;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.5s; }
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header-top">
      <div>
        <div class="brand-title">Site screenshots</div>
        <div class="brand-subtitle">Paste URLs, get full-page frames on your canvas.</div>
      </div>
      <button id="btnToggleFullscreenUI" class="btn-chip" type="button" title="Make this panel larger">Enlarge panel</button>
    </div>
    <div class="stepper">
      <button id="tabStep1" class="step-tab active" type="button"><span class="step-num">1</span> Add sites</button>
      <button id="tabStep2" class="step-tab" type="button"><span class="step-num">2</span> Captures</button>
    </div>
  </header>

  <main id="viewStep1" class="main-view">
    <section class="card">
      <div class="card-header">
        <div class="card-title">Websites</div>
        <span id="urlCountBadge" class="badge">0 URLs</span>
      </div>

      <div class="toolbar">
        <button id="btnLoadSample10" class="btn-chip" type="button" title="Fill in 10 popular sites to try it out">Try 10 sample sites</button>
        <button id="btnExtractText" class="btn-chip" type="button" title="Pull URLs out of messy text or markdown">Extract URLs from text</button>
        <label class="btn-chip" title="Add URLs from a .txt or .csv file">
          Import file
          <input id="fileImportInput" type="file" accept=".txt,.csv,.md,.json" style="display: none;" />
        </label>
        <button id="btnClearUrls" class="btn-chip" type="button">Clear</button>
      </div>

      <textarea
        id="urlTextarea"
        class="url-input"
        placeholder="One URL per line, or comma-separated&#10;stripe.com&#10;https://linear.app&#10;vercel.com"
      ></textarea>

      <div class="helper-row">
        <span id="batchRequirementHint">Paste as many as you like. 50+ works.</span>
        <label style="display: inline-flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;">
          <input id="chkDedupe" type="checkbox" checked />
          Skip duplicates
        </label>
      </div>

      <div id="parsedListContainer" class="parsed-list hidden"></div>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-title">Capture settings</div>
      </div>

      <div class="settings-grid">
        <label class="toggle-row highlight-whole-screen">
          <div class="toggle-label">
            <span>Full page</span>
            <small>Top to bottom, no cropping</small>
          </div>
          <input id="chkFullPage" type="checkbox" checked />
        </label>

        <label class="toggle-row">
          <div class="toggle-label">
            <span>Browser frame</span>
            <small>Header bar with the URL</small>
          </div>
          <input id="chkBrowserHeader" type="checkbox" checked />
        </label>
      </div>

      <div class="settings-grid">
        <div class="field">
          <label for="selectViewport">Screen width</label>
          <select id="selectViewport">
            <option value="1440x900" selected>Desktop, 1440 px</option>
            <option value="1920x1080">Full HD, 1920 px</option>
            <option value="1280x800">Laptop, 1280 px</option>
            <option value="768x1024">Tablet, 768 px</option>
            <option value="390x844">Mobile, 390 px</option>
          </select>
        </div>

        <div class="field">
          <label for="selectColumns">Frames per row in Figma</label>
          <select id="selectColumns">
            <option value="5" selected>5 columns</option>
            <option value="4">4 columns</option>
            <option value="3">3 columns</option>
            <option value="2">2 columns</option>
            <option value="10">10 columns (one row)</option>
          </select>
        </div>

        <div class="field">
          <label for="selectEngine">Screenshot source</label>
          <select id="selectEngine">
            <option value="auto" selected>Automatic</option>
            <option value="local">Local Chrome server only</option>
            <option value="microlink">Microlink (cloud)</option>
          </select>
          <small id="localServerStatus" style="display:block;color:var(--ink-2);">Checking local Chrome server…</small>
        </div>

        <div class="field">
          <label for="selectConcurrency">Sites at once</label>
          <select id="selectConcurrency">
            <option value="2">2 (gentle)</option>
            <option value="3" selected>3</option>
            <option value="4">4</option>
            <option value="6">6 (fastest)</option>
          </select>
        </div>
      </div>
    </section>
  </main>

  <main id="viewStep2" class="main-view hidden">
    <section class="progress-card">
      <div class="progress-top">
        <div>
          <div id="progressHeadline" class="progress-stats">Nothing captured yet</div>
          <div id="progressSubtext" class="progress-sub">Frames are placed on your canvas as each site finishes.</div>
        </div>
        <div style="display: flex; gap: 6px; flex-shrink: 0;">
          <button id="btnZoomAllFigma" class="btn-chip" type="button" title="Zoom the canvas to show every frame">Show all in Figma</button>
          <button id="btnRetryFailed" class="btn-chip hidden" type="button">Retry failed</button>
        </div>
      </div>
      <div class="progress-bar-track">
        <div id="progressBarFill" class="progress-bar-fill"></div>
      </div>
    </section>

    <section id="captureQueueList" class="capture-grid"></section>
  </main>

  <div id="previewModal" class="modal-backdrop hidden">
    <div class="modal-header">
      <div id="previewModalTitle" style="font-weight: 600; font-size: 12.5px;">Preview</div>
      <button id="btnClosePreviewModal" class="btn-chip" type="button">Close</button>
    </div>
    <div class="modal-body">
      <img id="previewModalImg" src="" alt="Full website preview" />
    </div>
  </div>

  <footer class="footer">
    <button id="btnBackToStep1" class="btn-secondary hidden" type="button">Edit sites</button>
    <button id="btnStopBatch" class="btn-danger hidden" type="button">Stop</button>
    <button id="btnStartScreenshot" class="btn-primary" type="button">Capture sites</button>
  </footer>

  <script>
    // =========================================================================
    // Bulk Website Screenshot — Whole-Screen UI & Capture Pipeline
    // =========================================================================

    const SAMPLE_10_URLS = [
      "https://stripe.com",
      "https://linear.app",
      "https://vercel.com",
      "https://www.figma.com",
      "https://github.com",
      "https://www.notion.so",
      "https://www.raycast.com",
      "https://supabase.com",
      "https://tailwindcss.com",
      "https://openai.com"
    ];

    // DOM Elements
    const btnToggleFullscreenUI = document.getElementById("btnToggleFullscreenUI");
    const tabStep1 = document.getElementById("tabStep1");
    const tabStep2 = document.getElementById("tabStep2");
    const viewStep1 = document.getElementById("viewStep1");
    const viewStep2 = document.getElementById("viewStep2");

    const urlTextarea = document.getElementById("urlTextarea");
    const urlCountBadge = document.getElementById("urlCountBadge");
    const batchRequirementHint = document.getElementById("batchRequirementHint");
    const parsedListContainer = document.getElementById("parsedListContainer");
    const chkDedupe = document.getElementById("chkDedupe");

    const btnLoadSample10 = document.getElementById("btnLoadSample10");
    const btnExtractText = document.getElementById("btnExtractText");
    const fileImportInput = document.getElementById("fileImportInput");
    const btnClearUrls = document.getElementById("btnClearUrls");

    const selectViewport = document.getElementById("selectViewport");
    const selectColumns = document.getElementById("selectColumns");
    const selectEngine = document.getElementById("selectEngine");
    const selectConcurrency = document.getElementById("selectConcurrency");
    const chkFullPage = document.getElementById("chkFullPage");
    const chkBrowserHeader = document.getElementById("chkBrowserHeader");

    const progressHeadline = document.getElementById("progressHeadline");
    const progressSubtext = document.getElementById("progressSubtext");
    const progressBarFill = document.getElementById("progressBarFill");
    const btnZoomAllFigma = document.getElementById("btnZoomAllFigma");
    const btnRetryFailed = document.getElementById("btnRetryFailed");
    const captureQueueList = document.getElementById("captureQueueList");

    const previewModal = document.getElementById("previewModal");
    const previewModalTitle = document.getElementById("previewModalTitle");
    const previewModalImg = document.getElementById("previewModalImg");
    const btnClosePreviewModal = document.getElementById("btnClosePreviewModal");

    const btnBackToStep1 = document.getElementById("btnBackToStep1");
    const btnStopBatch = document.getElementById("btnStopBatch");
    const btnStartScreenshot = document.getElementById("btnStartScreenshot");

    // State
    let isUiMaximized = false;
    let parsedUrls = [];
    let currentBatchId = null;
    let isCapturing = false;
    let stopRequested = false;
    let batchItems = [];

    // -------------------------------------------------------------------------
    // Whole-Screen Plugin UI Window Resize Toggle
    // -------------------------------------------------------------------------

    btnToggleFullscreenUI.addEventListener("click", () => {
      isUiMaximized = !isUiMaximized;
      btnToggleFullscreenUI.classList.toggle("active-toggle", isUiMaximized);
      btnToggleFullscreenUI.textContent = isUiMaximized
        ? "Shrink panel"
        : "Enlarge panel";

    // -------------------------------------------------------------------------
    // URL Parsing & Normalization
    // -------------------------------------------------------------------------

    function normalizeSingleUrl(raw) {
      if (!raw) return null;
      let str = raw.trim().replace(/^["'<({\[]+|["'>)}\],;]+$/g, "");
      if (!str) return null;

      if (!/^https?:\/\//i.test(str)) {
        if (
          /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+(\/.*)?$/.test(str) ||
          /^localhost(:\d+)?(\/.*)?$/i.test(str)
        ) {
          str = (str.startsWith("localhost") ? "http://" : "https://") + str;
        } else {
          return null;
        }
      }

      try {
        const u = new URL(str);
        if (!u.hostname || (!u.hostname.includes(".") && u.hostname !== "localhost")) {
          return null;
        }
        return u.href;
      } catch (_) {
        return null;
      }
    }

    function parseUrlsFromText(text, dedupe = true) {
      if (!text || !text.trim()) return [];
      const tokens = text
        .split(/[\r\n,;]+|\s+(?=https?:\/\/)/g)
        .map((t) => t.trim())
        .filter(Boolean);

      const results = [];
      const seen = new Set();

      for (const token of tokens) {
        const subTokens = token.split(/\s+/);
        for (const sub of subTokens) {
          const normalized = normalizeSingleUrl(sub);
          if (normalized) {
            const key = normalized.replace(/\/$/, "").toLowerCase();
            if (!dedupe || !seen.has(key)) {
              seen.add(key);
              results.push(normalized);
            }
          }
        }
      }
      return results;
    }

    function getHostname(url) {
      try {
        return new URL(url).hostname.replace(/^www\./, "");
      } catch (_) {
        return url;
      }
    }

    function updateParsedUrlsUI() {
      parsedUrls = parseUrlsFromText(urlTextarea.value, chkDedupe.checked);
      const count = parsedUrls.length;
      const modeLabel = chkFullPage.checked ? "full page" : "viewport only";

      urlCountBadge.textContent = `${count} URL${count === 1 ? "" : "s"}`;
      urlCountBadge.className =
        "badge " + (count >= 10 ? "ready-ten" : count > 0 ? "warn" : "");

      if (count >= 10) {
        batchRequirementHint.textContent = `✅ ${count} websites ready for ${modeLabel.toLowerCase()} bulk screenshot capture!`;
        batchRequirementHint.style.color = "var(--ok)";
      } else if (count > 0) {
        batchRequirementHint.textContent = `${count} URL${
          count === 1 ? "" : "s"
        } added (${10 - count} more for a 10-site bulk batch, or capture now).`;
        batchRequirementHint.style.color = "var(--warn)";
      } else {
        batchRequirementHint.textContent =
          "Tip: Paste 10+ URLs at once, or click 'Load 10 Sample Sites' above.";
        batchRequirementHint.style.color = "";
      }

      btnStartScreenshot.disabled = count === 0 || isCapturing;
      btnStartScreenshot.innerHTML =
        count > 0
          ? `Capture ${count} site${count === 1 ? "" : "s"}, ${modeLabel}`
          : `Capture sites`;

      if (count === 0) {
        parsedListContainer.classList.add("hidden");
        parsedListContainer.innerHTML = "";
        return;
      }

      parsedListContainer.classList.remove("hidden");
      parsedListContainer.innerHTML = parsedUrls
        .map((url, i) => {
          const host = getHostname(url);
          const fav = `https://www.google.com/s2/favicons?domain=${encodeURIComponent(
            host
          )}&sz=32`;
          return `
            <div class="parsed-item">
              <div class="parsed-item-left">
                <span class="parsed-index">#${String(i + 1).padStart(2, "0")}</span>
                <img class="parsed-favicon" src="${fav}" alt="" onerror="this.style.display='none'" />
                <span class="parsed-url" title="${url}">${url}</span>
              </div>
              <button class="btn-remove-url" type="button" data-remove-index="${i}" title="Remove URL">✕</button>
            </div>
          `;
        })
        .join("");
    }

    parsedListContainer.addEventListener("click", (e) => {

    // -------------------------------------------------------------------------
    // Whole-Screen Image Processing & Seamless Vertical Tile Slicing
    // -------------------------------------------------------------------------

    const MAX_FIGMA_TILE_HEIGHT = 3600;

    function escapeHtml(str) {
      return String(str == null ? "" : str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function loadImageElement(src, useCrossOrigin = false) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        if (useCrossOrigin) {
          img.crossOrigin = "anonymous";
        }
        const timer = setTimeout(() => {
          reject(new Error("Image decode timeout"));
        }, 30000);

        img.onload = () => {
          clearTimeout(timer);
          resolve(img);
        };
        img.onerror = () => {
          clearTimeout(timer);
          reject(new Error("Failed to decode screenshot image"));
        };
        img.src = src;
      });
    }

    function canvasToUint8Array(canvas) {
      return new Promise((resolve, reject) => {
        canvas.toBlob((blob) => {
          if (!blob) return reject(new Error("Canvas toBlob failed"));
          blob
            .arrayBuffer()
            .then((buf) => resolve(new Uint8Array(buf)))
            .catch(reject);
        }, "image/png");
      });
    }

    /**
     * Repairs cloud full-page screenshots where a `100vh` hero background/gradient
     * stretched to thousands of pixels tall (e.g., Canva's purple-to-cyan gradient
     * when captured by Google PageSpeed / Microlink without locking `100vh`).
     *
     * Detects contiguous vertical runs (> 340px tall) of scanlines that have zero
     * horizontal content/variance (pure solid or smooth vertical gradient background)
     * and smoothly compresses those empty stretches to 140px while keeping 100% of
     * rows that contain text, buttons, icons, images, or layout elements untouched.
     */
    function collapseStretchedHeroGradients(img, targetHeight, fullPage) {
      const srcW = img.naturalWidth || img.width || 1440;
      const srcH = img.naturalHeight || img.height || 900;
      if (!fullPage || srcH < targetHeight * 1.6) {
        return img;
      }

      try {
        const probeW = Math.min(200, srcW);
        const probeCanvas = document.createElement("canvas");
        probeCanvas.width = probeW;
        probeCanvas.height = srcH;
        const pCtx = probeCanvas.getContext("2d", { willReadFrequently: true });
        pCtx.drawImage(img, 0, 0, srcW, srcH, 0, 0, probeW, srcH);
        const data = pCtx.getImageData(0, 0, probeW, srcH).data;

        // Ignore outer 4% horizontal margins (scrollbars / frame edges)
        const xStart = Math.max(2, Math.floor(probeW * 0.04));
        const xEnd = Math.min(probeW - 2, Math.ceil(probeW * 0.96));
        const sampleCount = Math.max(1, xEnd - xStart);

        const isEmptyRow = new Uint8Array(srcH);
        for (let y = 0; y < srcH; y++) {
          const rowBase = y * probeW * 4;
          let rSum = 0,
            gSum = 0,
            bSum = 0;
          for (let x = xStart; x < xEnd; x++) {
            const idx = rowBase + x * 4;
            rSum += data[idx];
            gSum += data[idx + 1];
            bSum += data[idx + 2];
          }
          const rAvg = rSum / sampleCount;
          const gAvg = gSum / sampleCount;
          const bAvg = bSum / sampleCount;

          let maxDev = 0;
          for (let x = xStart; x < xEnd; x++) {
            const idx = rowBase + x * 4;
            const dev =
              Math.abs(data[idx] - rAvg) +
              Math.abs(data[idx + 1] - gAvg) +
              Math.abs(data[idx + 2] - bAvg);
            if (dev > maxDev) {
              maxDev = dev;
              if (maxDev > 16) break;
            }
          }
          // If the entire horizontal row has virtually uniform color across its width,
          // there is no text, card, icon, or image on this scanline.
          if (maxDev <= 16) {
            isEmptyRow[y] = 1;
          }
        }

        // Build vertical segments: compress any empty run > 320px down to 120px
        const MIN_STRETCH_RUN = 320;
        const KEEP_PADDING_PX = 120;
        const segments = [];
        let y = 0;
        let savedPixels = 0;

        while (y < srcH) {
          if (isEmptyRow[y] === 1) {
            let runEnd = y + 1;
            while (runEnd < srcH && isEmptyRow[runEnd] === 1) runEnd++;
            const runLen = runEnd - y;
            if (runLen > MIN_STRETCH_RUN) {
              segments.push({ srcY: y, srcH: runLen, destH: KEEP_PADDING_PX });
              savedPixels += runLen - KEEP_PADDING_PX;
            } else {
              segments.push({ srcY: y, srcH: runLen, destH: runLen });
            }
            y = runEnd;
          } else {
            let runEnd = y + 1;
            while (runEnd < srcH && isEmptyRow[runEnd] === 0) runEnd++;
            const runLen = runEnd - y;
            segments.push({ srcY: y, srcH: runLen, destH: runLen });
            y = runEnd;
          }
        }

        if (savedPixels < 200) {
          return img;
        }

        const newH = Math.max(200, srcH - savedPixels);
        const outCanvas = document.createElement("canvas");
        outCanvas.width = srcW;
        outCanvas.height = newH;
        const outCtx = outCanvas.getContext("2d");
        let destY = 0;
        for (const seg of segments) {
          outCtx.drawImage(
            img,
            0,
            seg.srcY,
            srcW,
            seg.srcH,
            0,
            destY,
            srcW,
            seg.destH
          );
          destY += seg.destH;
        }
        return outCanvas;
      } catch (_) {
        return img;
      }
    }

    /**
     * Converts any loaded HTMLImageElement into seamless vertical PNG tiles
     * preserving 100% of the whole website height (zero cropping), plus a
     * scrollable full-height preview image for the UI.
     */
    async function imageToFigmaTiles(rawImg, targetWidth, targetHeight, fullPage) {
      const img = collapseStretchedHeroGradients(rawImg, targetHeight, fullPage);
      const srcW = img.naturalWidth || img.width || targetWidth;
      const srcH = img.naturalHeight || img.height || targetHeight;

      const finalWidth = Math.min(4000, Math.round(targetWidth));
      const scale = finalWidth / srcW;

      // When fullPage (Whole Screen) is enabled, preserve the entire source height!
      const usableSrcH = fullPage
        ? srcH
        : Math.min(srcH, Math.round(targetHeight / scale));
      const finalHeight = Math.max(100, Math.round(usableSrcH * scale));

      // Create a full-height preview image for the plugin UI (scrollable in card & modal)
      const previewW = Math.min(640, finalWidth);
      const previewScale = previewW / srcW;
      const previewH = Math.min(8000, Math.max(120, Math.round(usableSrcH * previewScale)));
      const previewCanvas = document.createElement("canvas");
      previewCanvas.width = previewW;
      previewCanvas.height = previewH;
      const pCtx = previewCanvas.getContext("2d");
      pCtx.fillStyle = "#ffffff";
      pCtx.fillRect(0, 0, previewW, previewH);
      pCtx.drawImage(
        img,
        0,
        0,
        srcW,
        Math.min(usableSrcH, Math.round(previewH / previewScale)),
        0,
        0,
        previewW,
        previewH
      );
      const thumbDataUrl = previewCanvas.toDataURL("image/jpeg", 0.82);

      // Slice along source height so 100% of the whole screen is captured with zero seams
      const maxSrcChunkH = Math.max(100, Math.floor(MAX_FIGMA_TILE_HEIGHT / scale));
      const tiles = [];
      let srcY = 0;
      let destYOffset = 0;

      while (srcY < usableSrcH) {
        const srcChunkH = Math.min(maxSrcChunkH, usableSrcH - srcY);
        const tileHeight = Math.max(
          1,
          Math.min(MAX_FIGMA_TILE_HEIGHT, Math.round(srcChunkH * scale))
        );

        const tileCanvas = document.createElement("canvas");
        tileCanvas.width = finalWidth;
        tileCanvas.height = tileHeight;
        const ctx = tileCanvas.getContext("2d");
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, finalWidth, tileHeight);

        ctx.drawImage(
          img,
          0,
          srcY,
          srcW,
          srcChunkH,
          0,
          0,
          finalWidth,
          tileHeight
        );

        const bytes = await canvasToUint8Array(tileCanvas);
        tiles.push({
          bytes,
          width: finalWidth,
          height: tileHeight,
          yOffset: destYOffset
        });

        srcY += srcChunkH;
        destYOffset += tileHeight;
      }

      return {
        width: finalWidth,
        height: destYOffset || finalHeight,
        tiles,
        thumbDataUrl
      };
    }

    // -------------------------------------------------------------------------
    // Multi-Engine Whole-Screen Screenshot Fetchers
    // -------------------------------------------------------------------------

    async function fetchWithTimeout(url, options = {}, timeoutMs = 40000) {
      const controller = new AbortController();
      const id = setTimeout(() => controller.abort(), timeoutMs);
      try {
        const res = await fetch(url, { ...options, signal: controller.signal });
        return res;
      } finally {
        clearTimeout(id);
      }
    }

    // -------------------------------------------------------------------------
    // Local Chrome server health (the only engine that always returns the WHOLE page)
    // -------------------------------------------------------------------------
    let localServerUp = false;
    const localServerStatus = document.getElementById("localServerStatus");

    async function checkLocalServer() {
      try {
        const res = await fetchWithTimeout("http://localhost:3456/health", {}, 2500);
        localServerUp = res.ok;
      } catch (_) {
        localServerUp = false;
      }
      if (localServerStatus) {
        localServerStatus.innerHTML = localServerUp
          ? `<span style="color:var(--ok);font-weight:600;">Local Chrome server running</span>. Full-page captures are reliable.`
          : `<span style="color:var(--warn);font-weight:600;">Local Chrome server is off.</span> For reliable full-page shots, run <code>start-server.bat</code> (or <code>node server.js</code>), then <a href="#" id="linkRecheckLocal" style="color:inherit;text-decoration:underline;">re-check</a>`;
        const re = document.getElementById("linkRecheckLocal");
        if (re) {
          re.addEventListener("click", (e) => {
            e.preventDefault();
            localServerStatus.textContent = "Checking local Chrome server…";
            checkLocalServer();
          });
        }
      }
      return localServerUp;
    }

    /**
     * Engine 1: Microlink API (Full-Page Whole-Screen Screenshot)
     * Uses valid Microlink parameters: screenshot=true & screenshot.fullPage=true & meta=false
     */
    async function captureViaMicrolink(url, { width, height, fullPage }) {
      const params = new URLSearchParams({
        url,
        screenshot: "true",
        meta: "false",
        "viewport.width": String(width),
        "viewport.height": String(height),
        "viewport.deviceScaleFactor": "1"
      });
      if (fullPage) {
        params.set("screenshot.fullPage", "true");
      }

      const apiUrl = `https://api.microlink.io/?${params.toString()}`;
      const res = await fetchWithTimeout(apiUrl, {}, 45000);
      if (!res.ok) {
        throw new Error(`Microlink HTTP ${res.status}`);
      }
      const data = await res.json();
      const shotUrl =
        data && data.data && data.data.screenshot && data.data.screenshot.url;
      if (!shotUrl) {
        throw new Error("Microlink returned no screenshot URL");
      }

      const imgRes = await fetchWithTimeout(shotUrl, {}, 35000);
      if (!imgRes.ok) {
        throw new Error(`Screenshot download HTTP ${imgRes.status}`);
      }
      const blob = await imgRes.blob();
      const objUrl = URL.createObjectURL(blob);
      try {
        const img = await loadImageElement(objUrl, false);
        const processed = await imageToFigmaTiles(img, width, height, fullPage);
        return { ...processed, engineUsed: "Microlink Full-Page" };
      } finally {
        URL.revokeObjectURL(objUrl);
      }
    }

    /**
     * Engine 3: Thum.io Direct Image Stream
     */
    async function captureViaThumIo(url, { width, height, fullPage }) {
      const thumUrl = `https://image.thum.io/get/width/${width}/noanimate/${url}`;
      const img = await loadImageElement(thumUrl, true);
      const processed = await imageToFigmaTiles(img, width, height, fullPage);
      // Thum.io's free tier is capped at ~1200px tall; "fullpage" is a paid-plan feature.
      return {
        ...processed,
        engineUsed: "Thum.io",
        partial: Boolean(fullPage)
      };
    }

    /**
     * Engine 4: Local Chrome Companion Server (http://localhost:3456/screenshot)
     */
    async function captureViaLocalServer(url, { width, height, fullPage }) {
      const params = new URLSearchParams({
        url,
        width: String(width),
        height: String(height),
        fullPage: String(Boolean(fullPage))
      });
      const res = await fetchWithTimeout(
        `http://localhost:3456/screenshot?${params.toString()}`,
        {},
        50000
      );
      if (!res.ok) {
        throw new Error(`Local server HTTP ${res.status}`);
      }
      const blob = await res.blob();
      const objUrl = URL.createObjectURL(blob);
      try {
        const img = await loadImageElement(objUrl, false);
        const processed = await imageToFigmaTiles(img, width, height, fullPage);
        return { ...processed, engineUsed: "Local Chrome Full-Page" };
      } finally {
        URL.revokeObjectURL(objUrl);
      }
    }

    /**
     * Master dispatcher — Local Chrome Server first (whole page, unlimited, no API key),
     * then falls back to Microlink Full-Page -> Thum.io (top of page only).
     */
    async function captureWebsiteScreenshot(url, options) {
      const { engine } = options;

      if (engine === "local") {
        return await captureViaLocalServer(url, options);
      }
      if (engine === "microlink") {
        try {
          return await captureViaMicrolink(url, options);
        } catch (_) {
          return await captureViaLocalServer(url, options);
        }
      }

      const errors = [];
      const pipeline = [];
      if (localServerUp) {
        pipeline.push({
          name: "Local Chrome",
          fn: () => captureViaLocalServer(url, options)
        });
      }
      pipeline.push({
        name: "Microlink Full-Page",
        fn: () => captureViaMicrolink(url, options)
      });
      // Last resort: free tier only returns the TOP ~1200px of the page
      pipeline.push({ name: "Thum.io", fn: () => captureViaThumIo(url, options) });

      for (const step of pipeline) {
        try {
          const result = await step.fn();
          if (errors.length) result.fallbackNote = errors.join(" | ");
          return result;
        } catch (err) {
          errors.push(`${step.name}: ${err.message || err}`);
        }
      }

      throw new Error(errors.join(" | "));
    }

    // -------------------------------------------------------------------------
    // Step 2 UI Rendering & Batch Orchestration
    // -------------------------------------------------------------------------

    function renderCaptureQueue() {
      const total = batchItems.length;
      const doneCount = batchItems.filter((i) => i.status === "done").length;
      const errorCount = batchItems.filter((i) => i.status === "error").length;
      const activeCount = batchItems.filter((i) => i.status === "capturing").length;

      const pct = total > 0 ? Math.round(((doneCount + errorCount) / total) * 100) : 0;
      progressBarFill.style.width = `${pct}%`;

      if (isCapturing) {
        progressHeadline.textContent = `Capturing ${doneCount} of ${total} sites (${activeCount} in progress)`;
        progressSubtext.textContent = `Full-height screenshots are being placed onto your Figma canvas automatically`;
      } else {
        progressHeadline.textContent = `${doneCount} of ${total} frames placed in Figma`;
        progressSubtext.textContent =
          errorCount > 0
            ? `${errorCount} failed — use Retry failed to try them again.`
            : `All ${doneCount} full-page website screenshots are arranged on your Figma canvas! Scroll any preview below or click to enlarge.`;
      }

      btnRetryFailed.classList.toggle("hidden", isCapturing || errorCount === 0);

      captureQueueList.innerHTML = batchItems
        .map((item) => {
          const idxStr = String(item.index + 1).padStart(2, "0");
          let statusBadge = "";
          if (item.status === "queued") {
            statusBadge = `<span class="status-pill queued">Queued</span>`;
          } else if (item.status === "capturing") {
            statusBadge = `<span class="status-pill capturing"><span class="spinner"></span> Capturing</span>`;
          } else if (item.status === "done") {
            statusBadge = `<span class="status-pill done">In Figma</span>`;
          } else if (item.status === "error") {
            statusBadge = `<span class="status-pill error">✕ Failed</span>`;
          }

          const thumbContent = item.thumbUrl
            ? `<img src="${item.thumbUrl}" alt="${item.hostname}" title="Open full preview" data-preview-index="${item.index}" />`
            : `<div class="thumb-placeholder"><span>#${idxStr} • Waiting...</span></div>`;

          const partialWarn = item.partial
            ? `<div style="color:var(--warn);margin-top:3px;">Only the top of the page was captured (free fallback source).</div>`
            : "";
          const fallbackInfo = item.fallbackNote
            ? `<div style="color:var(--text-muted);margin-top:3px;font-size:10px;" title="${escapeHtml(item.fallbackNote)}">Fallback used: ${escapeHtml(item.fallbackNote).slice(0, 220)}</div>`
            : "";

          const metaText = item.error
            ? `<span style="color:var(--err);">${escapeHtml(item.error)}</span>`
            : item.engineUsed
            ? `${escapeHtml(item.engineUsed)} • <strong>${escapeHtml(item.dimensions || "")}</strong> (${item.tileCount || 1} tile${item.tileCount === 1 ? "" : "s"})${partialWarn}${fallbackInfo}`
            : "Waiting in queue...";

          return `
            <div class="capture-item status-${item.status}">
              <div class="capture-top-row">
                <div class="capture-title-row">
                  <span class="parsed-index">#${idxStr}</span>
                  <span class="capture-host">${item.hostname}</span>
                </div>
                ${statusBadge}
              </div>

              <div class="thumb-box" data-preview-index="${item.index}">
                ${thumbContent}
              </div>

              <div class="capture-info">
                <div class="capture-url" title="${item.url}">${item.url}</div>
                <div class="capture-meta">
                  <span>${metaText}</span>
                </div>
              </div>

              <div class="capture-actions">
                ${
                  item.thumbUrl
                    ? `<button class="btn-chip" type="button" data-preview-index="${item.index}" title="Open the full-page preview">Preview</button>`
                    : ""
                }
                ${
                  item.nodeId
                    ? `<button class="btn-chip" type="button" data-focus-node="${item.nodeId}" title="Select and zoom to this frame in Figma">Show in Figma</button>`
                    : ""
                }
                ${
                  !isCapturing && item.status === "error"
                    ? `<button class="btn-chip" type="button" data-retry-index="${item.index}">Retry</button>`
                    : ""
                }
              </div>
            </div>
          `;
        })
        .join("");
    }

    captureQueueList.addEventListener("click", (e) => {
      const previewTrigger = e.target.closest("[data-preview-index]");
      if (previewTrigger && !e.target.closest("[data-focus-node]") && !e.target.closest("[data-retry-index]")) {
        const idx = Number(previewTrigger.getAttribute("data-preview-index"));
        const item = batchItems.find((i) => i.index === idx);
        if (item && item.thumbUrl) {
          previewModalTitle.textContent = `#${String(item.index + 1).padStart(2, "0")} — ${item.hostname} (${item.dimensions || "full page"})`;
          previewModalImg.src = item.thumbUrl;
          previewModal.classList.remove("hidden");
        }
        return;
      }

      const focusBtn = e.target.closest("[data-focus-node]");
      if (focusBtn) {
        const nodeId = focusBtn.getAttribute("data-focus-node");
        parent.postMessage({ pluginMessage: { type: "FOCUS_NODE", nodeId } }, "*");
        return;
      }

      const retryBtn = e.target.closest("[data-retry-index]");
      if (retryBtn && !isCapturing) {
        const idx = Number(retryBtn.getAttribute("data-retry-index"));
        const item = batchItems.find((i) => i.index === idx);
        if (item) {
          runBatchCapture([item], false);
        }
      }
    });

    btnRetryFailed.addEventListener("click", () => {
      if (isCapturing) return;
      const failedItems = batchItems.filter((i) => i.status === "error");
      if (failedItems.length > 0) {
        runBatchCapture(failedItems, false);
      }
    });

    btnStopBatch.addEventListener("click", () => {
      stopRequested = true;
      isCapturing = false;
      switchToStep(2);
      renderCaptureQueue();
    });

    function getCaptureOptions() {
      const [wStr, hStr] = (selectViewport.value || "1440x900").split("x");
      const width = Number(wStr) || 1440;
      const height = Number(hStr) || 900;
      const columns = Number(selectColumns.value) || 5;
      const engine = selectEngine.value || "auto";
      const concurrency = Number(selectConcurrency.value) || 3;
      const fullPage = chkFullPage.checked;
      const includeHeader = chkBrowserHeader.checked;

      return {
        width,
        height,
        columns,
        engine,
        concurrency,
        fullPage,
        includeHeader,
        deviceLabel: `${width}×${fullPage ? "FullPage" : height}`
      };
    }

    async function runBatchCapture(itemsToProcess, isNewBatch = true) {
      const options = getCaptureOptions();
      isCapturing = true;
      stopRequested = false;

      await checkLocalServer();
      if (options.fullPage && options.engine !== "microlink" && !localServerUp) {
        parent.postMessage(
          {
            pluginMessage: {
              type: "NOTIFY",
              message:
                "Local Chrome server isn't running — pages may only capture the top. Run start-server.bat for full-page screenshots.",
              error: true
            }
          },
          "*"
        );
      }

      if (isNewBatch) {
        currentBatchId = `batch_${Date.now()}`;
        parent.postMessage(
          {
            pluginMessage: {
              type: "START_BATCH",
              batchId: currentBatchId,
              total: batchItems.length,
              options
            }
          },
          "*"
        );
      }

      for (const item of itemsToProcess) {
        item.status = "queued";
        item.error = null;
      }

      switchToStep(2);
      renderCaptureQueue();

      let cursor = 0;
      const poolSize = Math.min(options.concurrency, itemsToProcess.length);

      async function worker(workerIndex) {
        if (workerIndex > 0) {
          await new Promise((r) => setTimeout(r, workerIndex * 450));
        }
        while (cursor < itemsToProcess.length && !stopRequested) {
          const item = itemsToProcess[cursor++];
          item.status = "capturing";
          item.error = null;
          renderCaptureQueue();

          try {
            const result = await captureWebsiteScreenshot(item.url, options);
            if (stopRequested) break;

            item.thumbUrl = result.thumbDataUrl;
            item.engineUsed = result.engineUsed;
            item.dimensions = `${result.width}×${result.height}px`;
            item.tileCount = result.tiles.length;
            item.partial = Boolean(result.partial);
            item.fallbackNote = result.fallbackNote || null;

            parent.postMessage(
              {
                pluginMessage: {
                  type: "PLACE_SCREENSHOT",
                  batchId: currentBatchId,
                  index: item.index,
                  total: batchItems.length,
                  url: item.url,
                  hostname: item.hostname,
                  width: result.width,
                  height: result.height,
                  tiles: result.tiles,
                  partial: Boolean(result.partial),
                  options
                }
              },
              "*"
            );

            item.status = "done";
          } catch (err) {
            item.status = "error";
            item.error =
              err && err.message ? err.message : "Failed to capture screenshot";
          }

          renderCaptureQueue();
        }
      }

      const workers = [];
      for (let w = 0; w < poolSize; w++) {
        workers.push(worker(w));
      }
      await Promise.all(workers);

      isCapturing = false;
      switchToStep(2);
      renderCaptureQueue();

      if (!stopRequested) {
        parent.postMessage(
          {
            pluginMessage: {
              type: "FINISH_BATCH",
              batchId: currentBatchId
            }
          },
          "*"
        );
      }
    }

    btnStartScreenshot.addEventListener("click", () => {
      updateParsedUrlsUI();
      if (parsedUrls.length === 0 || isCapturing) return;

      batchItems = parsedUrls.map((url, index) => ({
        index,
        url,
        hostname: getHostname(url),
        status: "queued",
        error: null,
        thumbUrl: null,
        nodeId: null,
        engineUsed: null,
        dimensions: null,
        tileCount: 0,
        partial: false,
        fallbackNote: null
      }));

      runBatchCapture(batchItems, true);
    });

    window.onmessage = (event) => {
      const msg = event.data && event.data.pluginMessage;
      if (!msg) return;

      if (msg.type === "SCREENSHOT_PLACED") {
        const item = batchItems.find((i) => i.index === msg.index);
        if (item) {
          item.nodeId = msg.nodeId;
          item.status = "done";
          renderCaptureQueue();
        }
      } else if (msg.type === "PLACEMENT_ERROR") {
        const item = batchItems.find((i) => i.index === msg.index);
        if (item) {
          item.status = "error";
          item.error = msg.error || "Figma placement failed";
          renderCaptureQueue();
        }
      }
    };

    updateParsedUrlsUI();

    checkLocalServer();
    selectEngine.addEventListener("change", checkLocalServer);

  </script>
</body>
</html>
